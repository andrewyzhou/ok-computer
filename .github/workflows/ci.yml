# this workflow checks every change on the three desktop systems and builds the image for both arches.
# it uses no secrets: the tests run against fakes, and the image is built but never pushed.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# a new run on the same ref replaces an older one for a pull request, but each push to master runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # one failing system does not cancel the others, so a single run shows every system that breaks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    # the image is only built once the tests pass on every system.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # qemu lets the amd64 runner build the arm64 image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # the build only checks that the image builds on both arches. it is not pushed, so no registry login is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
